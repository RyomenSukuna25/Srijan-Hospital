{% extends 'base.html' %}{% block content %}<section class="pagehero compact"><div class="wrap"><span class="eyebrow">CONTACT</span><h1>We’re here to <em>help.</em></h1><p>Hospital contact details will be populated once the real Srijan Hospital operational information is confirmed.</p>{% if request.query_params.get('success') %}<div class="success">Your message has been received.</div>{% endif %}</div></section><section class="section"><div class="wrap formwrap"><form method="post" action="/contact" class="formgrid"><label>Full name<input required name="name"></label><label>Phone<input required name="phone" type="tel"></label><label>Email<input name="email" type="email"></label><label class="full">Message<textarea required name="message" rows="7"></textarea></label><button class="btn" type="submit">Send enquiry ↗</button></form></div></section>{% endblock %}
